name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-8.0.6

      - name: Clone JUCE 8.0.6
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      # CI=true (set by GitHub) makes CMakeLists.txt skip COPY_PLUGIN_AFTER_BUILD.
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_PATH="${{ github.workspace }}\JUCE"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release 2>&1 | Tee-Object build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host ""
            Write-Host "========== BUILD ERRORS =========="
            # Show lines that contain 'error' or 'warning' (case-insensitive)
            Select-String -Path build.log -Pattern ' error ' -CaseSensitive:$false |
              Select-Object -Last 60 | ForEach-Object { Write-Host $_.Line }
            Write-Host "========== LAST 40 LINES =========="
            Get-Content build.log | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
            exit $code
          }

      - name: Check build output
        shell: pwsh
        run: |
          foreach ($p in "build/LunaFX_artefacts/Release/VST3/Luna FX.vst3",
                         "build/LunaFX_artefacts/Release/Standalone/Luna FX.exe") {
            if (-not (Test-Path $p)) { throw "Missing build output: $p" }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          # /O forces output into a known folder regardless of what the .iss file sets
          New-Item -Force -ItemType Directory dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /O"dist" installer\LunaFX.iss
          Write-Host "Installer output:"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: LunaFX-Setup
          path: dist\LunaFX-Setup.exe
          if-no-files-found: error
